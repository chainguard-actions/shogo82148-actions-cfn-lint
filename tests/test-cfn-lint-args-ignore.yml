name: Test cfn_lint_args with ignore-checks from workspace root
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: any
          cfn_lint_args: "--ignore-checks E W I -- tests/fixtures/invalid/template.yaml"
      - name: Assert action succeeded with all checks ignored
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success when all checks are ignored"
            exit 1
          fi
          echo "PASS"
