name: Test basic usage - valid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy valid template to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/valid-template.yaml" "$GITHUB_WORKSPACE/template.yaml"

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          cfn_lint_args: template.yaml
          working_directory: .

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with no lint errors on a valid template"
          echo "PASS"
