name: Test basic usage - valid template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid CloudFormation template
        run: |
          mkdir -p templates
          cat > templates/valid.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: my-test-bucket
          EOF

      - name: Run cfn-lint on valid template
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: templates/valid.yaml

      - name: Assert action completed successfully
        run: |
          echo "cfn-lint action completed successfully on valid template"
          echo "PASS"
