name: Test cfn_lint_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: tests/fixtures/valid-template/template.yaml

      - name: Assert action succeeded with explicit cfn_lint_args
        run: |
          echo "PASS: cfn-lint ran successfully with explicit template path via cfn_lint_args"
