name: Test cfn_lint_args input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create CloudFormation templates for cfn_lint_args test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/args-test"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/args-test/valid.yaml" << 'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Valid template for args test

          Resources:
            MyQueue:
              Type: AWS::SQS::Queue
              Properties:
                QueueName: my-test-queue
          EOF
          cat > "$GITHUB_WORKSPACE/tests/fixtures/args-test/other.yaml" << 'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Another valid template

          Resources:
            MyTopic:
              Type: AWS::SNS::Topic
              Properties:
                TopicName: my-test-topic
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: tests/fixtures/args-test
          # Only lint the specific file, not all templates in the directory
          cfn_lint_args: valid.yaml

      - name: Assert action succeeded with cfn_lint_args
        run: |
          echo "PASS: action completed successfully using cfn_lint_args to specify a single template"
