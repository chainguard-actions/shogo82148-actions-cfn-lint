name: Test cfn_lint_args with template that has warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a CloudFormation template with a known warning
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cfn-args"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cfn-args/template.yaml" << 'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: A CloudFormation template with a warning
          Resources:
            MyTopic:
              Type: AWS::SNS::Topic
              Properties:
                TopicName: my-test-topic
          EOF

      - name: Run cfn-lint with custom cfn_lint_args
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: --include-checks W tests/fixtures/cfn-args/template.yaml

      - name: Assert action completed successfully
        run: |
          echo "PASS: cfn-lint ran successfully with custom cfn_lint_args"
