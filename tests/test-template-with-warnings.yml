name: Test cfn-lint with template that has warnings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create CloudFormation template with a warning (deprecated property)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-warn"
          cat > "$GITHUB_WORKSPACE/cfn-warn/template-warn.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A CloudFormation template with potential warnings
          Resources:
            MyEC2Instance:
              Type: AWS::EC2::Instance
              Properties:
                ImageId: ami-12345678
                InstanceType: t2.micro
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: "info"
          working_directory: cfn-warn
          cfn_lint_args: "template-warn.yaml"

      - name: Assert action completed (warnings are acceptable with fail_level=none)
        run: |
          echo "PASS: cfn-lint action completed - warnings reported but not failing due to fail_level=none"
