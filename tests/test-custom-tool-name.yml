name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cfn-toolname"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cfn-toolname/template.yaml" <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Tool Name Test Template
          Resources:
            MyTopic:
              Type: AWS::SNS::Topic
              Properties:
                TopicName: my-test-topic
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tool_name: "my-cfn-linter"
          level: "warning"
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: "$GITHUB_WORKSPACE/tests/fixtures/cfn-toolname/template.yaml"
          working_directory: "."

      - name: Assert action ran with custom tool_name and level
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom tool_name and level"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Docker issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
