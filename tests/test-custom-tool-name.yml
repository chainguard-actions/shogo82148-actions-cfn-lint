name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid CloudFormation template
        run: |
          mkdir -p tests/fixtures/cfn
          cat > tests/fixtures/cfn/simple-stack.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Simple stack for tool_name test
          Resources:
            MyTopic:
              Type: AWS::SNS::Topic
              Properties:
                TopicName: my-test-topic
          EOF

      - name: Run cfn-lint with custom tool_name and level
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-cfn-linter
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: tests/fixtures/cfn/simple-stack.yaml

      - name: Assert action completed with custom tool_name
        run: |
          echo "PASS: action completed with custom tool_name=my-cfn-linter and level=warning"
