name: Test custom tool_name and level inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid CloudFormation template
        run: |
          mkdir -p templates
          cat > templates/stack.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template
          Resources:
            MyTopic:
              Type: AWS::SNS::Topic
              Properties:
                TopicName: my-test-topic
          EOF

      - name: Run cfn-lint with custom tool_name and level
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-cfn-linter
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: templates/stack.yaml

      - name: Assert action completed with custom tool_name
        run: |
          echo "cfn-lint action completed successfully with custom tool_name and level"
          echo "PASS"
