name: Test cfn-lint with custom tool_name and level inputs
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        name: Run cfn-lint with custom tool_name and level
        uses: .
        with:
          github_token: ${{ github.token }}
          tool_name: my-cfn-linter
          level: warning
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: tests/fixtures/cfn
          cfn_lint_args: valid-template.yaml

      - name: Assert action succeeded with custom tool_name
        run: |
          echo "PASS: cfn-lint ran successfully with custom tool_name and level inputs"
