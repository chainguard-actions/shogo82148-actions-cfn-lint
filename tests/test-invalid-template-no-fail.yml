name: Test cfn-lint on invalid template with fail_level none
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: tests/fixtures/invalid-template

      - name: Assert action succeeded despite lint issues (fail_level=none)
        run: |
          echo "PASS: action completed with fail_level=none even though template has issues"
