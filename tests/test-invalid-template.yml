name: Test detection of invalid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-templates"
          cat > "$GITHUB_WORKSPACE/cfn-templates/invalid.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: An invalid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                InvalidProperty: this-property-does-not-exist
                BucketName: 123
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          cfn_lint_args: "$GITHUB_WORKSPACE/cfn-templates/invalid.yaml"
          working_directory: "."

      - name: Assert action ran (may fail due to lint errors or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome (success or failure expected for invalid template)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
