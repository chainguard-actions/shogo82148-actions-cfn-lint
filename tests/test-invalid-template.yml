name: Test invalid CloudFormation template detection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/invalid"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/invalid/template.yaml" << 'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: An invalid test template

          Resources:
            MyInstance:
              Type: AWS::EC2::Instance
              Properties:
                InstanceType: not-a-real-instance-type
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: tests/fixtures/invalid

      - name: Assert action completed (fail_level=none means no exit 1 even with findings)
        run: |
          echo "PASS: action completed with fail_level=none even with lint findings"
