name: Test invalid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid CloudFormation template
        run: |
          mkdir -p /tmp/cfn-invalid
          cat > /tmp/cfn-invalid/bad-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: An invalid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                InvalidProperty: this-property-does-not-exist
                BucketName: my-test-bucket
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: /tmp/cfn-invalid/bad-template.yaml

      - name: Assert action completed (fail_level=none so exit 0 even with lint errors)
        run: |
          echo "Action completed - lint errors detected but fail_level=none so no failure"
          echo "PASS"
