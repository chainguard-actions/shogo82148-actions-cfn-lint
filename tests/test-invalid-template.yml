name: Test invalid template - lint errors detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy invalid template to workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/invalid-template.yaml" "$GITHUB_WORKSPACE/bad-template.yaml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          cfn_lint_args: bad-template.yaml
          working_directory: .

      - name: Assert action detected lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the template has invalid properties
          # and fail_level=error is set
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly detected lint errors in invalid template"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully (lint errors reported but fail_level not triggered)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
