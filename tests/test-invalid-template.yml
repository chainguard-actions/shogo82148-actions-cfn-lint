name: Test cfn-lint detects issues in invalid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-templates"
          cat > "$GITHUB_WORKSPACE/cfn-templates/invalid.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: An invalid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: my-test-bucket
                InvalidProperty: this-is-not-valid
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: cfn-lint
        name: Run cfn-lint on invalid template (expect lint warnings/errors)
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: cfn-templates/invalid.yaml

      - name: Assert action completed (lint issues reported but not failing)
        run: |
          echo "PASS: cfn-lint ran and reported issues without failing (fail_level=none)"
