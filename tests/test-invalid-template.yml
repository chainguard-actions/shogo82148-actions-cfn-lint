name: Test with invalid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: error
          cfn_lint_args: tests/fixtures/cfn/invalid-template.yaml

      - name: Assert action detected errors in invalid template
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fail_level=error and an invalid template, cfn-lint should find errors
          # and the action should fail. If it succeeds, that's unexpected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid CloudFormation template (errors detected or sentinel repo issue)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran successfully (cfn-lint may have reported warnings only)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
