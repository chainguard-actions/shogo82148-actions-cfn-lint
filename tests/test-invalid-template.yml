name: Test with invalid CloudFormation template (fail_level none)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cfn-lint on invalid template with fail_level none
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          level: info
          cfn_lint_args: "tests/fixtures/invalid-template.yaml"

      - name: Assert action completed without failing (fail_level=none)
        run: |
          echo "cfn-lint processed invalid template but did not fail because fail_level=none"
          echo "PASS"
