name: Test with invalid CloudFormation template (lint errors detected, no fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create an invalid CloudFormation template (missing required fields)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-templates"
          cat > "$GITHUB_WORKSPACE/cfn-templates/invalid.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: An invalid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                InvalidProperty: this-property-does-not-exist
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: "$GITHUB_WORKSPACE/cfn-templates/invalid.yaml"
          working_directory: "."

      - name: Assert action completed (fail_level=none means no exit 1 even with lint errors)
        run: |
          echo "Action completed - fail_level=none so lint errors do not cause failure"
          echo "PASS"
