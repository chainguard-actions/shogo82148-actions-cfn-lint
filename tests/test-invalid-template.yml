name: Test with invalid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create an invalid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cfn-invalid"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cfn-invalid/bad-template.yaml" <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Invalid Test Template
          Resources:
            MyInstance:
              Type: AWS::EC2::Instance
              Properties:
                InstanceType: not-a-real-instance-type
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: "$GITHUB_WORKSPACE/tests/fixtures/cfn-invalid/bad-template.yaml"
          working_directory: "."

      - name: Assert action ran (cfn-lint should detect issues but not fail due to fail_level=none)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (issues reported but fail_level=none)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Docker issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
