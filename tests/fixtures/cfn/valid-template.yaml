AWSTemplateFormatVersion: "2010-09-09"
Description: Valid Test Template

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium

Resources:
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "my-bucket-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
