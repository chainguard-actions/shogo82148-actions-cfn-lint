AWSTemplateFormatVersion: '2010-09-09'
Description: A valid CloudFormation template in a subdirectory
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
Resources:
  MyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${Environment}-my-queue"
