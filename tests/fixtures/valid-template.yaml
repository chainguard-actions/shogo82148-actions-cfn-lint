AWSTemplateFormatVersion: "2010-09-09"
Description: "A simple valid CloudFormation template for testing"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: "Environment name"

Resources:
  MyBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${EnvironmentName}-my-test-bucket"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  BucketName:
    Description: "The name of the S3 bucket"
    Value: !Ref MyBucket
