name: Test cfn-lint with custom options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create CloudFormation templates directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-custom"
          cat > "$GITHUB_WORKSPACE/cfn-custom/template.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A CloudFormation template for custom options test
          Parameters:
            Environment:
              Type: String
              Default: dev
              AllowedValues:
                - dev
                - staging
                - prod
          Resources:
            MyQueue:
              Type: AWS::SQS::Queue
              Properties:
                QueueName: !Sub "${Environment}-my-queue"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          tool_name: "cfn-lint-custom"
          level: "warning"
          working_directory: cfn-custom
          cfn_lint_args: "template.yaml"

      - name: Assert action completed successfully
        run: |
          echo "PASS: cfn-lint action with custom options completed without error"
