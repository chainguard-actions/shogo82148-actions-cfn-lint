name: Test custom options (tool_name, filter_mode, level)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cfn-lint with custom options
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: warning
          tool_name: my-cfn-lint
          fail_level: none
          working_directory: .
          cfn_lint_args: pristine/shogo82148--actions-cfn-lint/v4.59.0/tests/fixtures/valid/template.yaml
      - name: Assert action completed with custom options
        run: |
          echo "Action completed successfully with custom tool_name and level options"
          echo "PASS"
