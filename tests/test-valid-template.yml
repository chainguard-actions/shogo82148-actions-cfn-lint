name: Test valid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid CloudFormation template
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/cfn-valid"
          cat > "$GITHUB_WORKSPACE/tests/cfn-valid/template.yaml" <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: A valid CloudFormation template for testing

          Parameters:
            InstanceType:
              Type: String
              Default: t3.micro
              AllowedValues:
                - t3.micro
                - t3.small

          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: !Sub "my-test-bucket-${AWS::AccountId}"
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: tests/cfn-valid/template.yaml
          working_directory: "."

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully with a valid template"
          echo "PASS"
