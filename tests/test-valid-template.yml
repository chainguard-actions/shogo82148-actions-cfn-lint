name: Test cfn-lint with valid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cfn-lint on valid template
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: "tests/fixtures"
          cfn_lint_args: "valid-template.yaml"

      - name: Assert action succeeded
        run: |
          echo "cfn-lint completed successfully on valid template"
          echo "PASS"
