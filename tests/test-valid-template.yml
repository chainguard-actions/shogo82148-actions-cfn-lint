name: Test valid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid CloudFormation template
        run: |
          mkdir -p /tmp/cfn-test
          cat > /tmp/cfn-test/template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
              Properties:
                BucketName: my-test-bucket
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: /tmp/cfn-test/template.yaml

      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
