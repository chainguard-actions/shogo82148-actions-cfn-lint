name: Test basic usage with valid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: "tests/fixtures/cfn/valid-template.yaml"
          working_directory: "."

      - name: Assert action succeeded with valid template
        run: |
          echo "Action completed successfully with a valid CloudFormation template"
          echo "PASS"
