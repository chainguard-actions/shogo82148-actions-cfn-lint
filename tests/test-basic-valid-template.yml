name: Test basic usage with valid CloudFormation template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cfn-lint on valid template
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: .
          cfn_lint_args: pristine/shogo82148--actions-cfn-lint/v4.59.0/tests/fixtures/valid/template.yaml
      - name: Assert action succeeded
        run: |
          echo "Action completed successfully - valid template produced no errors"
          echo "PASS"
