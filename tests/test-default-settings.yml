name: Test default settings with valid CloudFormation template
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cfn-lint with default settings
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          level: info
          cfn_lint_args: "tests/fixtures/valid-template.yaml"

      - name: Assert action completed with default tool_name
        run: |
          echo "cfn-lint ran with default tool_name (cfn-lint) and local reporter"
          echo "PASS"
