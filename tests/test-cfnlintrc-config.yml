name: Test .cfnlintrc config in working directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/rc
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert ignored check does not fail the step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since .cfnlintrc ignores the only error"
            exit 1
          fi
          echo "PASS"
