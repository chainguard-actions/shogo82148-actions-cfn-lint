name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CloudFormation template in subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cfn-subdir"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cfn-subdir/stack.yaml" <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Description: Subdirectory Template
          Resources:
            MyQueue:
              Type: AWS::SQS::Queue
              Properties:
                QueueName: my-test-queue
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: "tests/fixtures/cfn-subdir"
          cfn_lint_args: "stack.yaml"

      - name: Assert action ran with working_directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with working_directory set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or Docker issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
