name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CloudFormation template in subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/cfn-subdir"
          cat > "$GITHUB_WORKSPACE/cfn-subdir/template.yaml" << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template in a subdirectory
          Resources:
            MyQueue:
              Type: AWS::SQS::Queue
              Properties:
                QueueName: my-test-queue
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          cfn_lint_args: "cfn-subdir/template.yaml"
          working_directory: "."

      - name: Assert action succeeded with working_directory
        run: |
          echo "Action completed successfully using working_directory input"
          echo "PASS"
