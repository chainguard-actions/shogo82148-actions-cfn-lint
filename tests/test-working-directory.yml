name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure template.yaml does not exist at the repo root
        run: |
          if [ -e "$GITHUB_WORKSPACE/template.yaml" ]; then
            echo "template.yaml exists at root; test would be ambiguous"
            exit 1
          fi
      - id: action
        uses: .
        with:
          reporter: local
          filter_mode: nofilter
          fail_level: error
          working_directory: tests/fixtures/valid
          cfn_lint_args: template.yaml
      - name: Assert lint ran in working_directory
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (template.yaml should resolve inside working_directory)"
            exit 1
          fi
          echo "PASS"
