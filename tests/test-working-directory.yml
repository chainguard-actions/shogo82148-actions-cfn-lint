name: Test working directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create CloudFormation template in working directory
        run: |
          mkdir -p cfn-templates
          cat > cfn-templates/stack.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: A simple valid CloudFormation template for working directory test
          Resources:
            MyQueue:
              Type: AWS::SQS::Queue
              Properties:
                QueueName: my-test-queue
          EOF

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          reporter: local
          filter_mode: nofilter
          fail_level: none
          working_directory: cfn-templates
          cfn_lint_args: stack.yaml

      - name: Assert action completed with working directory
        run: |
          echo "Action completed using working_directory input"
          echo "PASS"
