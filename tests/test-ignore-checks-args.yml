name: Test cfn_lint_args ignore-checks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          working_directory: tests/fixtures/bad
          cfn_lint_args: --ignore-checks E3002 -- template.yaml
          reporter: local
          filter_mode: nofilter
          fail_level: error
      - name: Assert ignored error does not fail the step
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success since E3002 is ignored via cfn_lint_args"
            exit 1
          fi
          echo "PASS"
